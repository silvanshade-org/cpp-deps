# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# Reuse template anchors and parameterize compiler and image differences.
# Keep GCC 16, Clang 22, quality, format, and workflow lint parallel.
# </critical>
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group:
  workflow_dispatch:
    inputs:
      ci_image:
        description: Published pinned GHCR image for a one-run pull check
        required: false
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CCACHE_DEPEND: "true"
  # The same local-only tool exclusion is baked into the pinned CI image.
  MISE_DISABLE_TOOLS: github:colbymchenry/codegraph,github:max-sixty/worktrunk,github:cli/cli,github:j178/prek,github:nektos/act,github:woodruffw/zizmor,npm:@commitlint/cli

permissions:
  contents: read

# Keep main cache warmers and merge-queue checks; cancel superseded PR runs only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template:
    if: false
    runs-on: &linux ubuntu-24.04
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &git-checkout-history
        name: checkout full history for commit lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &setup-cpp
        name: set up GCC 16 on bare runners
        uses: ./.github/actions/setup-cpp # zizmor: ignore[self-repository]
        with:
          install: ${{ needs.ci-image-ref.outputs.image == '' }}
      - &setup-rust
        name: set up pinned Rust toolchain and cache
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.ci-image-ref.outputs.image == '' }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'clang-test' }}
          cache-workspace-crates: "true"
      - &setup-mise
        name: set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.14"
          install: ${{ needs.ci-image-ref.outputs.image == '' }}
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'clang-test' }}
      - &select-clang
        name: select pinned Clang++ through ccache
        run: echo "CXX=ccache $(mise which clang++)" >> "$GITHUB_ENV"
      - &upload-test-report
        name: upload JUnit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CI_REPORT_NAME }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - id: ref
        name: resolve the image reference
        env:
          CPP_DEPS_CI_IMAGE: ${{ inputs.ci_image || vars.CPP_DEPS_CI_IMAGE }}
        run: echo "image=$CPP_DEPS_CI_IMAGE" >> "$GITHUB_OUTPUT"

  changes:
    name: detect changed-file categories
    runs-on: *linux
    outputs:
      rust: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
    steps:
      - *git-checkout
      - id: filter
        name: filter changed paths
        continue-on-error: true
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/changed-categories.sh

  clang-test:
    needs: [ci-image-ref, changes]
    if: &heavy-lane ${{ needs.changes.outputs.rust == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: *linux
    container: ${{ needs.ci-image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: ccache clang++
      CI_REPORT_NAME: junit-clang
    steps:
      - *git-checkout
      - *setup-cpp
      - *setup-rust
      - *setup-mise
      - *select-clang
      - name: verify Clang 22
        run: clang++ --version
      - name: verify matching dependency scanner
        run: clang-scan-deps --version
      - name: run Rust-linked Clang 22 module and model tests
        run: mise run check:tests
      # A shim or wrapper hides Clang's resource directory from the scanner,
      # which then misses builtin headers such as stddef.h.
      - name: build modules through a compiler wrapper script
        run: scripts/ci/clang-wrapper-test.sh
      - *upload-test-report

  gcc-test:
    needs: [ci-image-ref, changes]
    if: *heavy-lane
    runs-on: *linux
    container: ${{ needs.ci-image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: ${{ needs.ci-image-ref.outputs.image == '' && 'ccache g++-16' || 'ccache g++' }}
      CI_REPORT_NAME: junit-gcc
    steps:
      - *git-checkout
      - *setup-cpp
      - *setup-rust
      - *setup-mise
      - name: verify GCC 16
        run: "${CXX#ccache } --version"
      - name: run Rust-linked GCC 16 module and model tests
        run: mise run check:tests
      - *upload-test-report

  quality:
    needs: [ci-image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.ci-image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: ccache clang++
    steps:
      - *git-checkout
      - *setup-cpp
      - *setup-rust
      - *setup-mise
      - *select-clang
      - name: check every workspace target
        run: mise run check:types
      - name: check strict Clippy wall
        run: mise run check:lint
      - name: check private-item rustdoc
        run: mise run check:doc
      - name: lint every C++ module translation unit
        run: mise run lint:cpp

  format-gate:
    name: check formatting and lint gates (treefmt)
    needs: ci-image-ref
    runs-on: *linux
    container: ${{ needs.ci-image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: ccache clang++
    steps:
      - *git-checkout-history
      - name: trust runner-mounted workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - *setup-rust
      - *setup-mise
      - name: refuse conflict markers
        run: mise run check:conflict-markers
      - name: verify shared baseline pin
        run: mise run check:baseline-hash
      - name: verify formatting and file budgets
        run: mise run treefmt:check
      - name: ci pin drift check
        run: mise run check:ci-pins
      - name: ci script fixture suite
        run: mise run check:ci-scripts
      - name: lint authored commits
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          COMMITLINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MISE_DISABLE_TOOLS: github:colbymchenry/codegraph,github:max-sixty/worktrunk,github:cli/cli,github:j178/prek,github:nektos/act,github:woodruffw/zizmor
        run: git rev-list --reverse --no-merges "$COMMITLINT_BASE..HEAD" | xargs -I{} env COMMITLINT_COMMIT={} mise exec -- commitlint --from {}~1 --to {}

  workflow-lint:
    name: check workflow lints (zizmor)
    runs-on: *linux
    steps:
      - *git-checkout
      - name: install pinned zizmor
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1
      - name: audit workflows
        run: zizmor .github/workflows
