# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# Reuse template anchors and parameterize compiler and image differences.
# Keep GCC 16, Clang 22, quality, format, and workflow lint parallel.
# </critical>
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group:
  workflow_dispatch:
    inputs:
      ci_image:
        description: Published pinned GHCR image for a one-run pull check
        required: false
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # The same local-only tool exclusion is baked into the pinned CI image.
  MISE_DISABLE_TOOLS: github:colbymchenry/codegraph,github:max-sixty/worktrunk,github:cli/cli,github:j178/prek,github:nektos/act,github:woodruffw/zizmor,npm:@commitlint/cli

permissions:
  contents: read

jobs:
  template:
    if: false
    runs-on: &linux ubuntu-24.04
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &checkout-history
        name: checkout full history for changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &setup-cpp
        name: set up GCC 16 on bare runners
        uses: ./.github/actions/setup-cpp # zizmor: ignore[self-repository]
        with:
          install: ${{ needs.image-ref.outputs.image == '' }}
      - &setup-rust
        name: set up pinned Rust toolchain and cache
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.image-ref.outputs.image == '' }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'clang-test' }}
          cache-workspace-crates: "true"
      - &setup-mise
        name: set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.14"
          install: ${{ needs.image-ref.outputs.image == '' }}
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'clang-test' }}

  image-ref:
    runs-on: *linux
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - id: ref
        name: relay optional prebuilt image to container jobs
        env:
          CPP_DEPS_CI_IMAGE: ${{ inputs.ci_image || vars.CPP_DEPS_CI_IMAGE }}
        run: echo "image=$CPP_DEPS_CI_IMAGE" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: *linux
    outputs:
      rust: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
    steps:
      - *checkout-history
      - id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        name: retain Rust and C++ gates for code or toolchain changes
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --name-only --no-renames "$BASE_SHA" HEAD | jq -R -s -r 'split("\n") | any(.[]; test("^(crates/|[.]github/|[.]config/|Cargo[.]|mise[.]|rust-toolchain[.]toml$|clippy[.]toml$|deny[.]toml$)")) | "rust=\(.)"' >> "$GITHUB_OUTPUT"

  clang-test:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: clang++
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: verify Clang 22
        run: clang++ --version
      - name: verify matching dependency scanner
        run: clang-scan-deps --version
      - name: run Rust-linked Clang 22 module and model tests
        run: mise run check:tests

  gcc-test:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: ${{ needs.image-ref.outputs.image == '' && 'g++-16' || 'g++' }}
    steps:
      - *checkout
      - *setup-cpp
      - *setup-rust
      - *setup-mise
      - name: verify GCC 16
        run: '"$CXX" --version'
      - name: run Rust-linked GCC 16 module and model tests
        run: mise run check:tests

  quality:
    needs: [image-ref, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: clang++
    steps:
      - *checkout
      - *setup-rust
      - *setup-mise
      - name: check every workspace target
        run: mise run check:types
      - name: check strict Clippy wall
        run: mise run check:lint
      - name: check private-item rustdoc
        run: mise run check:doc

  format:
    needs: image-ref
    runs-on: *linux
    container: ${{ needs.image-ref.outputs.image }} # zizmor: ignore[unpinned-images]
    permissions: *image-read-permissions
    env:
      CXX: clang++
    steps:
      - *checkout-history
      - name: trust runner-mounted workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - *setup-rust
      - *setup-mise
      - name: refuse conflict markers
        run: mise run check:conflict-markers
      - name: verify shared baseline pin
        run: mise run check:baseline-hash
      - name: verify changelog, format and file budgets
        run: mise run treefmt:check

  workflow-lint:
    runs-on: *linux
    steps:
      - *checkout
      - name: install pinned zizmor
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1
      - name: audit workflows
        run: zizmor .github/workflows
