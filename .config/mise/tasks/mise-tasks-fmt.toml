#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

[treefmt]
description = "Format the repository"
run = "treefmt"

["treefmt:check"]
description = "Check formatting and file budgets"
run = "treefmt --fail-on-change"

[changelog]
description = "Render committed release history after fetching full history and tags"
run = "git-cliff --config cliff.toml --output CHANGELOG.md"
