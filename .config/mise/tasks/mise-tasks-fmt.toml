#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

[treefmt]
description = "Run treefmt without a cache that ignores Git commit identity"
run = "treefmt --no-cache"

["treefmt:check"]
description = "Check formatting and generated history against current commits"
run = "treefmt --no-cache --fail-on-change"

["changelog:install"]
description = "Install the reviewed shared changelog generator"
run = "cargo install --git https://github.com/silvanshade-org/workflow --rev 60169a4e02a4afb5e21eccd3779ab3d29a0b38ea --locked workflow-changelog"

["changelog:render"]
description = "Render release history using the current PR title and Git tags"
depends = ["changelog:install"]
run = "workflow-changelog --exclude-path CHANGELOG.md"
